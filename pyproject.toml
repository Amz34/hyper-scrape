[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hyper-scrape"
version = "1.0.0"
description = "Ultra High-Throughput 3-Tier Web Extraction & AI RAG Ingestion Engine"
readme = "README.md"
authors = [{ name = "Aamir Zahran", email = "aamir1zahran@gmail.com" }]
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "scrapling>=0.5.1",
    "curl-cffi>=0.7.0",
    "crawl4ai>=0.4.0",
    "lxml>=5.1.0"
]

[project.scripts]
hyperscrape = "hyperscrape.cli:main"
