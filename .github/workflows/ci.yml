name: HyperScrape Enterprise CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Basic Health & Import Tests
        run: |
          python -c "import hyperscrape; print('HyperScrape version:', hyperscrape.__version__)"
          python -c "from hyperscrape.engines.tier1_scrapling import ScraplingEngine; e = ScraplingEngine(); print('Tier 1 Engine initialized successfully')"
