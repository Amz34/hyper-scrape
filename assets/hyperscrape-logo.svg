<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="boxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="brandAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Branded Container Box -->
  <rect x="15" y="15" width="210" height="210" rx="32" fill="url(#boxBg)" stroke="#38bdf8" stroke-width="3" filter="url(#glow)"/>
  <rect x="23" y="23" width="194" height="194" rx="26" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Left Stalk of H -->
  <rect x="62" y="60" width="22" height="120" rx="6" fill="#38bdf8"/>
  <!-- Right Stalk of H -->
  <rect x="156" y="60" width="22" height="120" rx="6" fill="#818cf8"/>
  <!-- Crossbar + Dynamic Kinetic Arrow Bridge -->
  <path d="M 74 120 L 166 120 L 146 104 L 178 120 L 146 136 L 166 120 Z" fill="url(#brandAccent)"/>
  <!-- Center Core Fusion Spark -->
  <circle cx="120" cy="120" r="5" fill="#ffffff" filter="url(#glow)"/>
</svg>
