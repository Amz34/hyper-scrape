<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#141e36"/>
    </linearGradient>

    <!-- Card Inner Glow -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Brand Cyan-Indigo Gradient for Accent -->
    <linearGradient id="brandAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Badge Amber Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Canvas -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>

  <!-- Subtle High-Tech Mesh / Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="320"/>
    <line x1="250" y1="0" x2="250" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="550" y1="0" x2="550" y2="320"/>
    <line x1="700" y1="0" x2="700" y2="320"/>
    <line x1="850" y1="0" x2="850" y2="320"/>
    <line x1="1000" y1="0" x2="1000" y2="320"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>

  <!-- Main Container Card -->
  <rect x="40" y="35" width="1120" height="250" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Top Decorative Color Strip -->
  <path d="M 40 47 Q 40 35 52 35 L 1148 35 Q 1160 35 1160 47 L 1160 49 L 40 49 Z" fill="url(#brandAccent)"/>

  <!-- Left: Genuine Geometric Brandmark Logo Box -->
  <g transform="translate(85, 75)">
    <!-- Box Container -->
    <rect x="0" y="0" width="160" height="160" rx="20" fill="#0b1120" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)"/>
    <rect x="6" y="6" width="148" height="148" rx="16" fill="none" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Distinct Architectural Monogram: Modern Bold 'H' with High-Velocity Lightning Fusion -->
    <!-- Left Stalk of H -->
    <rect x="36" y="34" width="18" height="92" rx="4" fill="#38bdf8"/>
    <!-- Right Stalk of H -->
    <rect x="106" y="34" width="18" height="92" rx="4" fill="#818cf8"/>
    <!-- Crossbar + Dynamic Kinetic Arrow Bridge -->
    <path d="M 45 80 L 115 80 L 100 68 L 124 80 L 100 92 L 115 80 Z" fill="url(#brandAccent)"/>
    <!-- Subtle Kinetic Spark at Center -->
    <circle cx="80" cy="80" r="4.5" fill="#ffffff" filter="url(#glow)"/>
  </g>

  <!-- Center-Right: Typography & Enterprise Branding Hierarchy -->
  <g transform="translate(285, 92)">
    <!-- Brand Name (Authentic Typography: Crisp geometric modern sans) -->
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
      HYPER<tspan fill="url(#brandAccent)">SCRAPE</tspan>
    </text>

    <!-- Enterprise Architecture Badge -->
    <g transform="translate(485, 12)">
      <rect x="0" y="0" width="165" height="32" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <circle cx="14" cy="16" r="4" fill="#10b981"/>
      <text x="26" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="12.5" font-weight="700" fill="#f8fafc" letter-spacing="0.8">
        ENTERPRISE 3-TIER
      </text>
    </g>

    <!-- Subtitle / Positioning Statement -->
    <text x="0" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="19" font-weight="500" fill="#94a3b8" letter-spacing="-0.2">
      High-Throughput Autonomous Web Extraction &amp; RAG Ingestion Engine
    </text>

    <!-- Component Engine Tags (Scrapling + Lightpanda V8 + Crawl4AI) -->
    <g transform="translate(0, 110)">
      <!-- Tier 1 Tag -->
      <rect x="0" y="0" width="185" height="28" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1.2"/>
      <text x="12" y="18" font-family="monospace" font-size="12" font-weight="700" fill="#38bdf8">T1: Scrapling TLS (&lt;200ms)</text>

      <!-- Tier 2 Tag -->
      <rect x="197" y="0" width="195" height="28" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1.2"/>
      <text x="210" y="18" font-family="monospace" font-size="12" font-weight="700" fill="#a5b4fc">T2: Lightpanda V8 (71MB)</text>

      <!-- Tier 3 Tag -->
      <rect x="404" y="0" width="190" height="28" rx="6" fill="#0f172a" stroke="#d97706" stroke-width="1.2"/>
      <text x="416" y="18" font-family="monospace" font-size="12" font-weight="700" fill="#fbbf24">T3: Crawl4AI RAG Markdown</text>

      <!-- Native Arch Tag -->
      <rect x="606" y="0" width="155" height="28" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
      <text x="618" y="18" font-family="monospace" font-size="12" font-weight="700" fill="#34d399">⚡ ARM64 &amp; x86_64</text>
    </g>
  </g>
</svg>
